# HomeEnergy settings. Secrets (Octopus / Ohme keys) will go in secrets.toml, which git ignores.

[givenergy]
host = "192.168.1.65"   # the inverter's WiFi dongle - reserve this address in the router
poll_seconds = 10

[web]
port = 8080             # the Pi uses 80 so the phone address is just http://energy.local

[control]
# true = the Pi pauses battery discharge during extra car slots. false = dry run (log only).
live = true
# true = also charge the battery from the grid during extra car slots, by borrowing
# charge slot 1 and putting it back to night_slot afterwards.
grid_charge = true
# The inverter's normal overnight charge. The Pi keeps slot 1 at this outside extra slots,
# so change it here, not in the phone app.
night_slot = "2330-0530"
