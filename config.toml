# HomeEnergy settings. Secrets (Octopus / Ohme keys) will go in secrets.toml, which git ignores.

[givenergy]
host = "192.168.1.65"   # the inverter's WiFi dongle - reserve this address in the router
poll_seconds = 10

[web]
port = 8080             # the Pi uses 80 so the phone address is just http://energy.local

[control]
# true = the Pi pauses battery discharge during extra car slots. false = dry run (log only).
live = true
# Grid charging in extra slots. OFF: this inverter refuses charge slot 2 (HR 31/32), tested 2026-11-12.
grid_charge = false
